version: "3.8"

services:
  # Local AI Inference Engine (Ollama for Llama 3.2 Vision & Qwen 27B)
  ollama:
    image: ollama/ollama:latest
    container_name: wolf-logic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Persistent local model storage on SSD
      - ./models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4

  # High-Throughput Node.js Ingest, DMX Matrix & Magic Sheet Engine
  wolf-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wolf-logic-engine
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      # Web UI & Real-time WebSocket Stream
      - "8888:8888/tcp"
      # ETC Eos OSC Ingest & Feedback Ports
      - "8000:8000/udp"
      - "8001:8001/udp"
      - "9000:9000/udp"
      # DMX over IP Protocols (Art-Net 4 & sACN E1.31)
      - "6454:6454/udp"
      - "5568:5568/udp"
      # TouchOSC Bridge MIDI Port
      - "58210:58210/udp"
    volumes:
      - ./data:/app/data
      - ./csv_exports:/app/csv_exports
      - ./.agents:/app/.agents
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
      - WOLF_DB_PATH=/app/data/wolf_logic_telemetry.db
      - OLLAMA_HOST=http://ollama:11434/api/generate
